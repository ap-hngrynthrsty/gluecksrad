<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyntune - Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a5cf0'/%3E%3Cstop offset='.45' stop-color='%235a4bd6'/%3E%3Cstop offset='1' stop-color='%23362a85'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-weight='700' font-size='28' fill='white' text-anchor='middle' letter-spacing='-1'%3Edt%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lead.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><span>dt</span></div>
      <div class="brand-text">
        <span class="brand-title">dyntune</span>
        <span class="brand-sub">dynamic tuning &middot; <span data-i18n="leadSubtitle"></span></span>
      </div>
    </div>
    <div class="stats-bar">
      <button id="likeBtn" class="like-btn" type="button" title="Like"><svg viewBox="0 0 32 29" width="17" height="17"><defs><linearGradient id="likeBtnGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2145"/></linearGradient></defs><path fill="url(#likeBtnGrad)" d="M23.6 0c-3.4 0-6.3 2-7.6 4.9C14.7 2 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 15.4 16.8 16 17.1.6-.3 16-7.7 16-17.1C32 3.8 28.2 0 23.6 0z"/></svg></button>
      <span id="heartsCount" class="stats-count">0</span>
      <span class="stats-sep">&middot;</span>
      <span id="sessionsCount" class="stats-count">0</span>
      <span class="stats-label" data-i18n="sessionsLabel"></span>
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <button id="langEnBtn" class="lang-btn active" type="button">EN</button>
        <button id="langDeBtn" class="lang-btn" type="button">DE</button>
      </div>
      <button id="resetVotesBtn" class="btn btn-ghost" data-i18n="resetVotesBtn"></button>
      <button id="resetAllBtn" class="btn btn-ghost" data-i18n="resetAllBtn"></button>
    </div>
  </header>

  <main class="layout">

    <section class="panel">
      <button id="helpToggle" class="help-toggle" type="button" aria-expanded="false">
        <span data-i18n="helpToggleLabel"></span>
        <span class="help-toggle-icon">▾</span>
      </button>
      <div id="helpPanel" class="help-panel hidden">
        <p><strong>1.</strong> <span data-i18n="helpStep1"></span></p>
        <p><strong>2.</strong> <span data-i18n="helpStep2"></span></p>
        <p><strong>3.</strong> <span data-i18n="helpStep3"></span></p>
        <p><strong>4.</strong> <span data-i18n="helpStep4"></span></p>
      </div>

      <div class="card">
        <div class="card-label"><span class="step">1</span><span data-i18n="questionLabel"></span></div>
        <textarea id="questionInput" rows="2" data-i18n-placeholder="questionPlaceholder"></textarea>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-label"><span class="step">2</span><span data-i18n="answersLabel"></span></div>
          <span class="muted" id="answersCount">0</span>
        </div>
        <div id="answersList" class="answers-list"></div>
        <button id="addAnswerBtn" class="btn btn-dashed" data-i18n="addAnswerBtn"></button>
        <label class="toggle-row">
          <span data-i18n="allowAnswersLabel"></span>
          <span class="toggle-switch">
            <input type="checkbox" id="allowAnswersToggle">
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-label"><span class="step">3</span><span data-i18n="participantsLabel"></span></div>
          <span class="muted" id="participantsCount">0</span>
        </div>
        <input id="nameInput" type="text" data-i18n-placeholder="namePlaceholder">
        <div class="row-inline">
          <select id="voteSelect"></select>
          <button id="addParticipantBtn" class="btn btn-dark" data-i18n="addParticipantBtn"></button>
        </div>
        <p class="hint" data-i18n="participantHintLead"></p>
      </div>

      <div class="card qr-card">
        <div class="card-label"><span class="step">4</span><span data-i18n="joinLabel"></span></div>
        <div class="qr-wrap">
          <img id="qrImg" alt="QR code to join" width="150" height="150">
          <div class="qr-info">
            <span class="muted" data-i18n="qrHint"></span>
            <code id="joinUrl">…</code>
          </div>
        </div>
      </div>
    </section>

    <section class="stage">
      <div class="question-display">
        <span class="eyebrow" data-i18n="questionEyebrow"></span>
        <h1 id="questionDisplay"></h1>
      </div>

      <div class="wheel-wrap">
        <div id="pointer" class="pointer"></div>
        <canvas id="wheelCanvas" width="760" height="760"></canvas>
      </div>

      <div class="spin-area">
        <button id="spinBtn" class="btn btn-spin" disabled data-i18n="spinBtn"></button>
        <span class="muted" id="statusLine">0</span>
      </div>
    </section>

  </main>

</div>

<!-- These overlays sit outside .app on purpose: .app is what gets the
     "shake" transform for the tip celebration, and any position:fixed
     element nested inside a transformed ancestor stops being anchored
     to the real viewport - it gets clipped to that ancestor's box
     instead, which made the celebration invisible until scrolled to
     the top of the page. -->
<div id="winnerOverlay" class="winner-overlay hidden">
  <canvas id="confettiCanvas"></canvas>
  <div id="winnerCard" class="winner-card hidden">
    <span class="winner-eyebrow" data-i18n="winnerLabel"></span>
    <div id="winnerBadge" class="winner-badge"></div>
    <div id="winnerLabel" class="winner-label glitch" data-text=""></div>
    <span class="winner-meta" id="winnerMeta"></span>
    <div class="winner-actions">
      <button id="closeWinnerBtn" class="btn btn-outline" data-i18n="closeBtn"></button>
      <button id="againBtn" class="btn btn-dark" data-i18n="spinAgainBtn"></button>
    </div>
  </div>
</div>

<div id="flicker" class="flicker hidden"></div>

<div class="support-btn-wrap">
  <button id="supportBtn" class="support-btn" data-i18n="supportBtn"></button>
  <div id="supportPrompt" class="support-prompt hidden"></div>
</div>
<div id="supportOverlay" class="support-overlay hidden">
  <canvas id="heartsCanvas"></canvas>
  <div id="supportThanks" class="support-thanks glitch" data-text=""></div>
</div>
<div id="supportFlicker" class="flicker hidden"></div>

<div id="milestoneOverlay" class="milestone-overlay hidden">
  <canvas id="milestoneConfetti"></canvas>
  <div id="milestoneText" class="milestone-text glitch" data-text=""></div>
</div>

<script src="lead.js"></script>
</body>
</html>
