<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dyntune - Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a5cf0'/%3E%3Cstop offset='.45' stop-color='%235a4bd6'/%3E%3Cstop offset='1' stop-color='%23362a85'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-weight='700' font-size='28' fill='white' text-anchor='middle' letter-spacing='-1'%3Edt%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="vote.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand-icon"><span>dt</span></div>
    <div class="brand-text">
      <span class="brand-title">dyntune</span>
      <span class="brand-sub">dynamic tuning</span>
    </div>
    <div class="lang-switch">
      <button id="langEnBtn" class="lang-btn active" type="button">EN</button>
      <button id="langDeBtn" class="lang-btn" type="button">DE</button>
    </div>
  </header>

  <main class="content">
    <div id="nameGate" class="card">
      <span class="label" data-i18n="nameLabel"></span>
      <input id="nameInput" type="text" data-i18n-placeholder="namePlaceholder" maxlength="40">
      <button id="nameContinueBtn" class="btn btn-dark" disabled data-i18n="continueBtn"></button>
    </div>

    <div id="voteArea" class="vote-area hidden">
      <span class="label" data-i18n="questionLabel"></span>
      <h1 id="questionDisplay"></h1>

      <div class="wheel-wrap">
        <div id="pointer" class="pointer"></div>
        <canvas id="wheelCanvas" width="560" height="560"></canvas>
      </div>

      <div class="options-list" id="optionsList"></div>
      <p id="votedHint" class="hint hidden" data-i18n="votedHint"></p>

      <div id="addAnswerArea" class="add-answer-area hidden">
        <input id="newAnswerInput" type="text" data-i18n-placeholder="newAnswerPlaceholder" maxlength="80">
        <button id="addAnswerBtn" class="btn btn-outline-dark">+</button>
      </div>
    </div>
  </main>

  <div id="winnerOverlay" class="winner-overlay hidden">
    <canvas id="confettiCanvas"></canvas>
    <div id="winnerCard" class="winner-card hidden">
      <span class="winner-eyebrow" data-i18n="winnerLabel"></span>
      <div id="winnerBadge" class="winner-badge"></div>
      <div id="winnerLabel" class="winner-label glitch" data-text=""></div>
      <span class="winner-meta" id="winnerMeta"></span>
      <button id="closeWinnerBtn" class="btn btn-outline" data-i18n="closeBtn"></button>
    </div>
  </div>

  <div id="flicker" class="flicker hidden"></div>
</div>
<script src="vote.js"></script>
</body>
</html>
