<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyntune - Lead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236a5cf0'/%3E%3Cstop offset='.45' stop-color='%235a4bd6'/%3E%3Cstop offset='1' stop-color='%23362a85'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial, sans-serif' font-weight='700' font-size='28' fill='white' text-anchor='middle' letter-spacing='-1'%3Edt%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lead.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon"><span>dt</span></div>
      <div class="brand-text">
        <span class="brand-title">dyntune</span>
        <span class="brand-sub">dynamic tuning &middot; <span data-i18n="leadSubtitle"></span></span>
      </div>
    </div>
    <div class="header-actions">
      <div class="lang-switch">
        <button id="langEnBtn" class="lang-btn active" type="button">EN</button>
        <button id="langDeBtn" class="lang-btn" type="button">DE</button>
      </div>
      <button id="resetVotesBtn" class="btn btn-ghost" data-i18n="resetVotesBtn"></button>
      <button id="resetAllBtn" class="btn btn-ghost" data-i18n="resetAllBtn"></button>
      <button id="newSessionBtn" class="btn btn-ghost" data-i18n="newSessionBtn"></button>
    </div>
  </header>

  <main class="layout">

    <section class="panel">
      <div class="card">
        <div class="card-label"><span class="step">1</span><span data-i18n="questionLabel"></span></div>
        <textarea id="questionInput" rows="2" data-i18n-placeholder="questionPlaceholder"></textarea>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-label"><span class="step">2</span><span data-i18n="answersLabel"></span></div>
          <span class="muted" id="answersCount">0</span>
        </div>
        <div id="answersList" class="answers-list"></div>
        <button id="addAnswerBtn" class="btn btn-dashed" data-i18n="addAnswerBtn"></button>
        <label class="toggle-row">
          <span data-i18n="allowAnswersLabel"></span>
          <span class="toggle-switch">
            <input type="checkbox" id="allowAnswersToggle">
            <span class="toggle-slider"></span>
          </span>
        </label>
      </div>

      <div class="card">
        <div class="card-row">
          <div class="card-label"><span class="step">3</span><span data-i18n="participantsLabel"></span></div>
          <span class="muted" id="participantsCount">0</span>
        </div>
        <input id="nameInput" type="text" data-i18n-placeholder="namePlaceholder">
        <div class="row-inline">
          <select id="voteSelect"></select>
          <button id="addParticipantBtn" class="btn btn-dark" data-i18n="addParticipantBtn"></button>
        </div>
        <p class="hint" data-i18n="participantHintLeadWeb"></p>
      </div>

      <div class="card code-card">
        <div class="card-label"><span class="step">4</span><span data-i18n="joinLabelWeb"></span></div>
        <div class="qr-wrap">
          <div id="qrCode" class="qr-code"></div>
          <div class="qr-info">
            <div class="code-display" id="codeDisplay">------</div>
            <div class="row-inline">
              <code id="joinUrl" class="join-url">…</code>
              <button id="copyLinkBtn" class="btn btn-ghost" data-i18n="copyBtn"></button>
            </div>
          </div>
        </div>
        <p class="hint" data-i18n="joinHintWeb"></p>
      </div>
    </section>

    <section class="stage">
      <div class="question-display">
        <span class="eyebrow" data-i18n="questionEyebrow"></span>
        <h1 id="questionDisplay"></h1>
      </div>

      <div class="wheel-wrap">
        <div id="pointer" class="pointer"></div>
        <canvas id="wheelCanvas" width="760" height="760"></canvas>
      </div>

      <div class="spin-area">
        <button id="spinBtn" class="btn btn-spin" disabled data-i18n="spinBtn"></button>
        <span class="muted" id="statusLine">0</span>
      </div>
    </section>

  </main>

  <div id="winnerOverlay" class="winner-overlay hidden">
    <canvas id="confettiCanvas"></canvas>
    <div id="winnerCard" class="winner-card hidden">
      <span class="winner-eyebrow" data-i18n="winnerLabel"></span>
      <div id="winnerBadge" class="winner-badge"></div>
      <div id="winnerLabel" class="winner-label glitch" data-text=""></div>
      <span class="winner-meta" id="winnerMeta"></span>
      <div class="winner-actions">
        <button id="closeWinnerBtn" class="btn btn-outline" data-i18n="closeBtn"></button>
        <button id="againBtn" class="btn btn-dark" data-i18n="spinAgainBtn"></button>
      </div>
    </div>
  </div>

  <div id="flicker" class="flicker hidden"></div>

  <a href="privacy.html" class="privacy-link" data-i18n="privacyLink"></a>

</div>
<script src="qrcode.min.js"></script>
<script src="lead.js"></script>
</body>
</html>
